name: Feature request
description: Propose a provider-neutral improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or workflow gap should be addressed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the smallest provider-neutral solution.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Privacy and licensing boundaries
      description: Explain any effect on identities, logs, credentials, media, or network exposure.
    validations:
      required: true
